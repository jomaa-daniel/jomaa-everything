name: hub

on:
  push:
    paths: ["jomaa-home-hub/**", ".github/workflows/hub.yml"]
  pull_request:
    paths: ["jomaa-home-hub/**", ".github/workflows/hub.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jomaa-home-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jomaa-home-hub/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/verify.py
