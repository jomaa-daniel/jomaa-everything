name: Deploy Jomaa services and routes

# A signed HTTPS request triggers the local deployment only after verification.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jomaa-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jomaa-home-hub/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 jomaa-deploy/verify.py

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trigger signed deployment
        env:
          JOMAA_DEPLOY_SECRET: ${{ secrets.JOMAA_DEPLOY_SECRET }}
          JOMAA_DEPLOY_URL: ${{ vars.JOMAA_DEPLOY_URL || 'https://hub.jomaa.org/deploy' }}
        run: python3 jomaa-deploy/notify.py
