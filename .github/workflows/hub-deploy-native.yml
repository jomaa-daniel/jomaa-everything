name: Deploy native home hub

# A signed HTTPS request triggers the local deployment only after verification.
on:
  push:
    branches: [main]
    paths:
      - 'jomaa-home-hub/**'
      - '.github/workflows/hub-deploy-native.yml'
      - '.github/scripts/notify_hub.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-hub-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jomaa-home-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: jomaa-home-hub/tools/go.mod
          cache-dependency-path: |
            jomaa-home-hub/go.sum
            jomaa-home-hub/tools/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify.py

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trigger signed deployment
        env:
          HUB_DEPLOY_SECRET: ${{ secrets.HUB_DEPLOY_SECRET }}
          HUB_DEPLOY_URL: ${{ vars.HUB_DEPLOY_URL || 'https://hub.jomaa.org/deploy' }}
        run: python3 .github/scripts/notify_hub.py
