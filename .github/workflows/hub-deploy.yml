name: Deploy hub to Cloudflare

# Tests, then deploys with the CLOUDFLARE_* repository secrets. "Deploy" creates or updates the
# Cloudflare Tunnel, its route and the DNS record for CLOUDFLARE_HOSTNAME. The
# hub itself runs at home; its machine starts cloudflared with
# `python3 scripts/hubctl.py up`. Until CLOUDFLARE_HOSTNAME is set, deploy skips.

on:
  push:
    branches: [main]
    paths: ["jomaa-home-hub/**", ".github/workflows/hub-deploy.yml"]
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: deploy-hub-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jomaa-home-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jomaa-home-hub/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 scripts/verify.py

      - name: Deploy tunnel, route and DNS
        run: python3 scripts/cloudflare.py deploy --if-configured
        env:
          CLOUDFLARE_HOSTNAME: ${{ secrets.CLOUDFLARE_HOSTNAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
