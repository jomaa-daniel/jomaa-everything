<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invite someone · Jomaa Home</title>
    <link rel="stylesheet" href="/home/base.css" />
    <link rel="stylesheet" href="/manage/style.css" />
    <link rel="stylesheet" href="/home/accounts.css" />
    <script type="module" src="/invite/app.js"></script>
  </head>
  <body>
    <header><a href="/home">Jomaa Home</a><button id="logout" hidden>Sign out</button></header>
    <main>
      <h1>Invite someone</h1>
      <p class="muted">
        Each link creates one account and expires on the date listed. New accounts have no access until you grant it on
        <a href="/permissions">Permissions</a>.
      </p>
      <p id="notice" role="status" aria-live="polite"></p>
      <section id="login-section" hidden>
        <form id="login-form" class="login">
          <label for="password">Hub password</label
          ><input id="password" type="password" autocomplete="current-password" required /><button class="primary">
            Sign in
          </button>
        </form>
      </section>
      <p id="not-owner" hidden>Only the hub owner can create invites.</p>
      <div id="content" hidden>
        <div class="create-form">
          <label for="link" class="sr-only">Invite link</label
          ><input id="link" readonly placeholder="No link yet" /><button id="copy" disabled>Copy</button
          ><button id="create" class="primary">Create link</button>
        </div>
        <h2>Unused invites</h2>
        <ul id="invites" class="management-list"></ul>
        <p id="invites-empty" class="muted" hidden>None.</p>
      </div>
    </main>
  </body>
</html>
