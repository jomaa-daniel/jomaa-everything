<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create your account · Jomaa Home</title>
    <link rel="stylesheet" href="/home/base.css" />
    <link rel="stylesheet" href="/home/accounts.css" />
    <script type="module" src="/join/app.js"></script>
  </head>
  <body>
    <header><a href="/home">Jomaa Home</a></header>
    <main>
      <h1>Create your account</h1>
      <noscript><p>Enable JavaScript to create your account.</p></noscript>
      <p id="notice" role="status" aria-live="polite"></p>
      <p id="invalid" hidden>This invite link is invalid, used, or expired. Ask for a new one.</p>
      <form id="join-form" class="login" hidden>
        <label for="username">Username</label>
        <input
          id="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          pattern="[a-z0-9][a-z0-9._\-]{2,31}"
          title="3 to 32 lowercase letters, digits, dots, dashes, or underscores"
          required
        />
        <label for="password">Password (at least <span id="password-min"></span> characters)</label>
        <input id="password" type="password" autocomplete="new-password" required />
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" required />
        <button class="primary">Create account</button>
      </form>
      <p id="done" hidden>
        Account <strong id="done-username"></strong> created. You can sign in once the hub owner grants access.
        <a href="/home">Jomaa Home</a>
      </p>
    </main>
  </body>
</html>
