<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Permissions · Jomaa Home</title>
    <link rel="stylesheet" href="/home/base.css" />
    <link rel="stylesheet" href="/home/accounts.css" />
    <script type="module" src="/permissions/app.js"></script>
  </head>
  <body>
    <header><a href="/home">Jomaa Home</a><button id="logout" hidden>Sign out</button></header>
    <main>
      <h1>Permissions</h1>
      <p class="muted">Pages each account can open. Changes save immediately. <a href="/invite">Invite someone</a></p>
      <p id="notice" role="status" aria-live="polite"></p>
      <section id="login-section" hidden>
        <form id="login-form" class="login">
          <label for="password">Hub password</label
          ><input id="password" type="password" autocomplete="current-password" required /><button class="primary">
            Sign in
          </button>
        </form>
      </section>
      <p id="not-owner" hidden>Only the hub owner can manage permissions.</p>
      <div id="content" hidden>
        <div class="table-wrap">
          <table>
            <thead>
              <tr id="scope-head"></tr>
            </thead>
            <tbody id="account-rows"></tbody>
          </table>
        </div>
        <p id="accounts-empty" class="muted" hidden>No accounts yet.</p>
      </div>
    </main>
  </body>
</html>
