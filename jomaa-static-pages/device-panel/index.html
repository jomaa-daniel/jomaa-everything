<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Control your Jomaa home lights and rooms."
    />
    <title>Device Panel</title>
    <link rel="stylesheet" href="/lights/style.css" />
    <script type="module" src="/lights/app.js"></script>
  </head>
  <body>
    <main class="panel">
      <h1 class="sr-only">Device Panel</h1>
      <p id="announcer" class="sr-only" aria-live="polite"></p>
      <p id="connecting" class="connecting">Connecting to your hub…</p>
      <noscript><p>Enable JavaScript to control your lights.</p></noscript>

      <section
        id="login-section"
        class="login-section"
        aria-labelledby="login-title"
        hidden
      >
        <svg class="login-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 18h6m-5 3h4M8.5 15.5a6 6 0 1 1 7 0L15 18H9z" />
        </svg>
        <h2 id="login-title">Device Panel</h2>
        <form id="login-form" class="login">
          <label for="username"
            >Username (leave blank for the hub password)</label
          >
          <input id="username" autocomplete="username" autocapitalize="none" />
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p id="login-message" class="login-message" hidden></p>
          <button class="primary">Sign in</button>
        </form>
        <button id="reconnect" class="text-button" hidden>Try again</button>
      </section>

      <section
        id="controller"
        class="controller"
        aria-labelledby="target-title"
        aria-describedby="target-description"
        hidden
      >
        <header class="status-row">
          <h2 id="target-title" class="room-title"></h2>
          <button
            id="status-toggle"
            class="status"
            type="button"
            aria-expanded="false"
            aria-controls="device-problems"
          >
            <span id="power-state" class="status-note"></span>
            <span id="device-dots" class="dots" role="img" hidden></span>
          </button>
        </header>
        <ul id="device-problems" class="device-problems" hidden></ul>
        <p id="target-description" class="sr-only"></p>

        <div
          id="controls"
          class="controls"
          role="group"
          aria-label="Light settings"
        >
          <div class="power-area">
            <button
              id="power-toggle"
              class="power"
              role="switch"
              aria-checked="false"
              aria-labelledby="target-title"
              aria-describedby="power-state"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v8" />
                <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
              </svg>
            </button>
          </div>

          <div id="brightness-setting" class="band" hidden>
            <div class="band-head">
              <span class="band-name">Brightness</span>
              <span id="brightness-value" class="band-value"></span>
            </div>
            <div id="brightness-wrap" class="slider-wrap">
              <input
                id="brightness"
                class="slider"
                type="range"
                min="1"
                max="100"
                step="1"
                value="100"
                aria-label="Brightness"
              />
              <span class="slider-end dim" aria-hidden="true">Dim</span>
              <span class="slider-end bright" aria-hidden="true">Bright</span>
              <span class="slider-thumb" aria-hidden="true"></span>
            </div>
          </div>

          <div id="temperature-setting" class="band temperature" hidden>
            <div class="band-head">
              <span class="band-name">Warmth</span>
              <span id="temperature-value" class="band-value"></span>
            </div>
            <div id="temperature-wrap" class="slider-wrap">
              <input
                id="temperature"
                class="slider"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                aria-label="Color temperature, warm to cool"
              />
              <span class="slider-end warm" aria-hidden="true">Warm</span>
              <span class="slider-end cool" aria-hidden="true">Cool</span>
              <span class="slider-thumb" aria-hidden="true"></span>
            </div>
          </div>

          <div id="color-setting" class="band" hidden>
            <div class="band-head">
              <span class="band-name">Color</span>
              <span id="color-value" class="band-value"></span>
            </div>
            <div class="swatches" role="group" aria-label="Color">
              <div class="swatch-cell">
                <button
                  class="swatch"
                  data-color="#ff0000"
                  aria-label="Red"
                  aria-pressed="false"
                ></button>
              </div>
              <div class="swatch-cell">
                <button
                  class="swatch"
                  data-color="#ff8000"
                  aria-label="Orange"
                  aria-pressed="false"
                ></button>
              </div>
              <div class="swatch-cell">
                <button
                  class="swatch"
                  data-color="#34c759"
                  aria-label="Green"
                  aria-pressed="false"
                ></button>
              </div>
              <div class="swatch-cell">
                <button
                  class="swatch"
                  data-color="#ff2d92"
                  aria-label="Pink"
                  aria-pressed="false"
                ></button>
              </div>
              <div class="swatch-cell">
                <button
                  class="swatch"
                  data-custom="custom-1"
                  aria-label="Custom color 1"
                  aria-pressed="false"
                ></button>
                <button
                  class="swatch-edit"
                  data-edit="custom-1"
                  aria-label="Edit custom color 1"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 4l4 4L9 19H5v-4z" />
                  </svg>
                </button>
              </div>
              <div class="swatch-cell">
                <button
                  class="swatch"
                  data-custom="custom-2"
                  aria-label="Custom color 2"
                  aria-pressed="false"
                ></button>
                <button
                  class="swatch-edit"
                  data-edit="custom-2"
                  aria-label="Edit custom color 2"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 4l4 4L9 19H5v-4z" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <nav id="tabs" class="rooms" aria-label="Rooms" hidden>
        <div id="tab-list" class="room-list"></div>
      </nav>

      <dialog id="color-dialog" aria-labelledby="custom-title">
        <h2 id="custom-title">Custom color</h2>
        <div
          id="color-grid"
          class="color-grid"
          role="group"
          aria-labelledby="custom-title"
        ></div>
        <div class="dialog-actions">
          <button id="cancel-color" class="secondary" type="button">
            Cancel
          </button>
        </div>
      </dialog>
    </main>
  </body>
</html>
