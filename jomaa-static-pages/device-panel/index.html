<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Control your Jomaa home lights and rooms."
    />
    <title>Light Control Panel</title>
    <link rel="stylesheet" href="/lights/style.css" />
    <script type="module" src="/lights/app.js"></script>
  </head>
  <body>
    <main class="panel">
      <h1 class="sr-only">Light Control Panel</h1>
      <div id="toolbar" class="toolbar" hidden>
        <label for="target-picker" class="sr-only">Room or device</label>
        <select id="target-picker" aria-label="Room or device"></select>
        <div class="toolbar-actions">
          <button
            id="refresh"
            class="icon-button"
            aria-label="Refresh"
            title="Refresh"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M20 7v5h-5M4 17v-5h5" />
              <path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1" />
            </svg>
          </button>
          <button
            id="logout"
            class="icon-button"
            aria-label="Sign out"
            title="Sign out"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M10 4H4v16h6M14 8l4 4-4 4M9 12h12" />
            </svg>
          </button>
        </div>
      </div>
      <p id="notice" class="notice" role="status" aria-live="polite">
        Connecting to your hub…
      </p>
      <noscript><p>Enable JavaScript to control your lights.</p></noscript>
      <section id="login-section" class="login-section" hidden>
        <div class="login-intro">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="M9 18h6m-5 3h4M8.5 15.5a6 6 0 1 1 7 0L15 18H9z" />
          </svg>
          <h2>Device Panel</h2>
          <p>Your home hub, one touch away.</p>
        </div>
        <form id="login-form" class="login">
          <label for="password">Hub password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Hub password"
            required
          />
          <button class="primary">Sign in</button>
        </form>
        <button id="reconnect" class="text-button">Reconnect to hub</button>
      </section>
      <section
        id="controller"
        class="controller"
        hidden
        aria-label="Light controller"
      >
        <h2 id="target-title" class="sr-only"></h2>
        <p id="target-description" class="sr-only"></p>
        <fieldset id="controls">
          <legend class="sr-only">Light settings</legend>
          <div class="power-container">
            <span
              id="status-dot"
              class="status-dot"
              role="status"
              aria-label="Not connected"
              title="Not connected"
            ></span>
            <button
              id="power-toggle"
              class="power-toggle"
              role="switch"
              aria-checked="false"
              aria-label="Power"
            >
              <span class="power-toggle-knob"></span>
              <span id="power-state" class="sr-only">Unknown</span>
            </button>
          </div>
          <section
            id="color-setting"
            class="row-1"
            aria-labelledby="color-title"
            hidden
          >
            <div class="colors-container">
              <h3 id="color-title" class="section-title">Color Picker</h3>
              <div class="colors-grid">
                <button
                  class="color-btn red"
                  data-color="#ff0000"
                  aria-label="Red"
                  aria-pressed="false"
                  title="Red"
                ></button>
                <button
                  class="color-btn orange"
                  data-color="#ff8000"
                  aria-label="Orange"
                  aria-pressed="false"
                  title="Orange"
                ></button>
                <button
                  id="custom-1"
                  class="color-btn custom"
                  aria-label="Custom 1"
                  aria-pressed="false"
                  title="Choose custom color 1"
                ></button>
                <button
                  id="custom-2"
                  class="color-btn custom"
                  aria-label="Custom 2"
                  aria-pressed="false"
                  title="Choose custom color 2"
                ></button>
              </div>
            </div>
          </section>
          <div
            id="brightness-setting"
            class="row-2"
            role="group"
            aria-label="Brightness"
            aria-describedby="brightness-value"
            hidden
          >
            <p id="brightness-value" class="sr-only"></p>
            <button
              class="brightness-btn"
              data-brightness="10"
              aria-label="10 percent brightness"
              aria-pressed="false"
            >
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="5" /></svg
              >10%
            </button>
            <button
              class="brightness-btn"
              data-brightness="50"
              aria-label="50 percent brightness"
              aria-pressed="false"
            >
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="5" />
                <path d="M12 1v2m0 18v2" /></svg
              >50%
            </button>
            <button
              class="brightness-btn"
              data-brightness="75"
              aria-label="75 percent brightness"
              aria-pressed="false"
            >
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="5" />
                <path d="M12 1v2m0 18v2M1 12h2m18 0h2" /></svg
              >75%
            </button>
            <button
              class="brightness-btn"
              data-brightness="100"
              aria-label="100 percent brightness"
              aria-pressed="false"
            >
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="5" />
                <path
                  d="M12 1v2m0 18v2M1 12h2m18 0h2m-18.78-7.78 1.42 1.42m12.72 12.72 1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                /></svg
              >100%
            </button>
          </div>
          <section
            id="temperature-setting"
            class="row-3"
            aria-labelledby="temperature-title"
            hidden
          >
            <h3 id="temperature-title" class="section-title">
              Color Temperature
            </h3>
            <div class="slider-container">
              <div class="slider-wrap" id="temperature-wrap">
                <input
                  id="temperature"
                  type="range"
                  min="0"
                  max="100"
                  step="1"
                  value="50"
                  class="slider"
                  aria-label="Color temperature"
                />
                <div class="slider-crossbar" aria-hidden="true"></div>
              </div>
              <div class="slider-labels">
                <span class="label-end">Warm −100%</span
                ><output
                  class="label-value"
                  id="temperature-value"
                  for="temperature"
                  >0%</output
                ><span class="label-end">Cool +100%</span>
              </div>
            </div>
          </section>
        </fieldset>
        <p id="state-note" class="state-note" hidden></p>
        <p id="empty" hidden>
          No lights configured. Add devices and rooms to the hub configuration.
        </p>
      </section>
      <dialog id="color-dialog">
        <form id="color-form">
          <h2 id="custom-title">Custom color</h2>
          <label for="color">Choose color</label>
          <input id="color" type="color" value="#667eea" />
          <div class="dialog-actions">
            <button id="cancel-color" type="button">Cancel</button
            ><button class="primary">Apply color</button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>
